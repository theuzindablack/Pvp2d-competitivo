<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core OS - Arena PVP 2D</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; background: #080808; margin: 0 auto; }
        
        #hud { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-around; pointer-events: none; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px #000; z-index: 5; }
        .hud-p1 { color: #00f2ff; }
        .hud-p2 { color: #ff0055; }

        #tela-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; }
        #overlay-msg { font-size: 28px; color: #ffaa00; margin-bottom: 10px; font-weight: bold; }
        #overlay-sub { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .btn-acao { background: #00ff88; color: #000; border: none; padding: 12px 30px; font-weight: bold; font-size: 14px; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-family: monospace; }
        
        /* Joystick Mobile */
        .joystick-base { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; touch-action: none; z-index: 5; }
        .joystick-stick { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(0,242,255,0.4); border: 2px solid #00f2ff; border-radius: 50%; pointer-events: none; transition: transform 0.05s linear; }
        
        .btn-atirar { position: absolute; bottom: 40px; right: 30px; width: 85px; height: 85px; background: rgba(255,0,85,0.4); border: 2px solid #ff0055; border-radius: 50%; color: white; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; z-index: 5; box-shadow: 0 0 10px rgba(255,0,85,0.3); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-p1">VOCÊ (AZUL): <span id="hp-voce">100</span> HP</div>
        <div class="hud-p2">ADVERSÁRIO (VERMELHO): <span id="hp-adv">100</span> HP</div>
    </div>

    <div id="tela-overlay">
        <div id="overlay-msg">CONECTANDO À ARENA</div>
        <div id="overlay-sub">Preparando o campo de batalha...</div>
        <button id="btn-voltar" class="btn-acao" style="display:none;" onclick="fecharArena()">SAIR DA ARENA</button>
    </div>

    <div class="joystick-base" id="js-base">
        <div class="joystick-stick" id="js-stick"></div>
    </div>

    <div class="btn-atirar" id="btn-fire">ATIRAR</div>

    <canvas id="arenaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('arenaCanvas');
        const ctx = canvas.getContext('2d');

        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        const urlParams = new URLSearchParams(window.location.search);
        const adversarioNome = urlParams.get('adversario') || "Adversario";
        const meuNome = localStorage.getItem('core_os_username') || "Player";

        let jogoAtivo = false;
        let meuHP = 100;
        let advHP = 100;

        // Posições Iniciais (Jogador 1 Azul e Jogador 2 Vermelho)
        let playerX = 100;
        let playerY = canvas.height / 2;
        let advX = canvas.width - 100;
        let advY = canvas.height / 2;

        const raioPlayer = 18;
        let balas = [];

        // Caixas de Obstáculos na Arena
        const caixas = [
            { x: canvas.width / 2 - 40, y: canvas.height / 2 - 80, w: 80, h: 160 },
            { x: canvas.width / 4, y: 100, w: 100, h: 40 },
            { x: (canvas.width / 4) * 3 - 100, y: canvas.height - 140, w: 100, h: 40 }
        ];

        // Controles Teclado (WASD)
        const teclas = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { if (teclas.hasOwnProperty(e.key.toLowerCase())) teclas[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (teclas.hasOwnProperty(e.key.toLowerCase())) teclas[e.key.toLowerCase()] = false; });

        // Joystick Touch Corrigido
        let jsAtivo = false;
        let jsCentroX = 0, jsCentroY = 0;
        let moveX = 0, moveY = 0;

        const jsBase = document.getElementById('js-base');
        const jsStick = document.getElementById('js-stick');

        jsBase.addEventListener('pointerdown', (e) => {
            jsAtivo = true;
            const rect = jsBase.getBoundingClientRect();
            jsCentroX = rect.left + rect.width / 2;
            jsCentroY = rect.top + rect.height / 2;
            atualizarJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (!jsAtivo) return;
            atualizarJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            jsAtivo = false;
            moveX = 0;
            moveY = 0;
            jsStick.style.transform = `translate(0px, 0px)`;
        });

        function atualizarJoystick(clientX, clientY) {
            let dx = clientX - jsCentroX;
            let dy = clientY - jsCentroY;
            const dist = Math.hypot(dx, dy);
            const raioMax = 40;

            if (dist > raioMax) {
                dx = (dx / dist) * raioMax;
                dy = (dy / dist) * raioMax;
            }

            jsStick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / raioMax;
            moveY = dy / raioMax;
        }

        // Botão Atirar (Disparo Direcionado para o Inimigo)
        document.getElementById('btn-fire').addEventListener('pointerdown', () => {
            if (!jogoAtivo) return;
            
            // Calcula o ângulo exato em direção ao adversário
            let angulo = Math.atan2(advY - playerY, advX - playerX);
            let velocidadeTiro = 9;

            balas.push({
                x: playerX,
                y: playerY,
                vx: Math.cos(angulo) * velocidadeTiro,
                vy: Math.sin(angulo) * velocidadeTiro,
                nosso: true
            });
        });

        // Contagem Regressiva
        let contador = 3;
        const overlay = document.getElementById('tela-overlay');
        const msg = document.getElementById('overlay-msg');
        const sub = document.getElementById('overlay-sub');

        function iniciarContagem() {
            if (contador > 0) {
                msg.innerText = contador;
                sub.innerText = "Preparem-se!";
                contador--;
                setTimeout(iniciarContagem, 1000);
            } else {
                msg.innerText = "FIGHT!";
                sub.innerText = "Elimine o oponente!";
                setTimeout(() => {
                    overlay.style.display = 'none';
                    jogoAtivo = true;
                }, 700);
            }
        }
        setTimeout(iniciarContagem, 500);

        // Verificação de colisão com caixas
        ellsColideCaixa = function(nx, ny) {
            for (let c of caixas) {
                if (nx + raioPlayer > c.x && nx - raioPlayer < c.x + c.w &&
                    ny + raioPlayer > c.y && ny - raioPlayer < c.y + c.h) {
                    return true;
                }
            }
            return false;
        };

        // Loop Principal
        function loop() {
            ctx.fillStyle = '#080808';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Paredes / Bordas da Arena
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 6;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // Desenhar Caixas Obstáculos
            ctx.fillStyle = '#1c1c1c';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            for (let c of caixas) {
                ctx.fillRect(c.x, c.y, c.w, c.h);
                ctx.strokeRect(c.x, c.y, c.w, c.h);
            }

            if (jogoAtivo) {
                // Movimento via Teclado (WASD)
                let tecladoX = 0, tecladoY = 0;
                if (teclas.w) tecladoY = -1;
                if (teclas.s) tecladoY = 1;
                if (teclas.a) tecladoX = -1;
                if (teclas.d) tecladoX = 1;

                let finalMoveX = moveX !== 0 ? moveX : tecladoX;
                let finalMoveY = moveY !== 0 ? moveY : tecladoY;

                let proximoX = playerX + finalMoveX * 4.5;
                let proximoY = playerY + finalMoveY * 4.5;

                // Colisão com bordas da tela e caixas
                if (proximoX > 20 && proximoX < canvas.width - 20 && !ellsColideCaixa(proximoX, playerY)) playerX = proximoX;
                if (proximoY > 20 && proximoY < canvas.height - 20 && !ellsColideCaixa(playerX, proximoY)) playerY = proximoY;

                // IA Simples do Adversário Vermelho
                if (Math.random() < 0.02) {
                    advX += (Math.random() - 0.5) * 45;
                    advY += (Math.random() - 0.5) * 45;
                    advX = Math.max(30, Math.min(canvas.width - 30, advX));
                    advY = Math.max(30, Math.min(canvas.height - 30, advY));
                }
                if (Math.random() < 0.035) {
                    let anguloAdv = Math.atan2(playerY - advY, playerX - advX);
                    balas.push({
                        x: advX, y: advY,
                        vx: Math.cos(anguloAdv) * 7,
                        vy: Math.sin(anguloAdv) * 7,
                        nosso: false
                    });
                }

                // Atualizar Balas e Colisões
                for (let i = balas.length - 1; i >= 0; i--) {
                    let b = balas[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    ctx.fillStyle = b.nosso ? '#00f2ff' : '#ff0055';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Colisão bala com caixas
                    let colidiuCaixa = false;
                    for (let c of caixas) {
                        if (b.x > c.x && b.x < c.x + c.w && b.y > c.y && b.y < c.y + c.h) {
                            colidiuCaixa = true;
                            break;
                        }
                    }

                    if (colidiuCaixa || b.x < 10 || b.x > canvas.width - 10 || b.y < 10 || b.y > canvas.height - 10) {
                        balas.splice(i, 1);
                        continue;
                    }

                    // Colisões com jogadores
                    if (b.nosso && Math.hypot(b.x - advX, b.y - advY) < raioPlayer) {
                        advHP -= 15;
                        document.getElementById('hp-adv').innerText = Math.max(0, advHP);
                        balas.splice(i, 1);
                        if (advHP <= 0) { finalizarPartida(true); break; }
                    } else if (!b.nosso && Math.hypot(b.x - playerX, b.y - playerY) < raioPlayer) {
                        meuHP -= 15;
                        document.getElementById('hp-voce').innerText = Math.max(0, meuHP);
                        balas.splice(i, 1);
                        if (meuHP <= 0) { finalizarPartida(false); break; }
                    }
                }
            }

            // Desenhar Jogador 1 (AZUL)
            ctx.fillStyle = '#00f2ff';
            ctx.beginPath(); 
            ctx.arc(playerX, playerY, raioPlayer, 0, Math.PI * 2); 
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Desenhar Jogador 2 (VERMELHO)
            ctx.fillStyle = '#ff0055';
            ctx.beginPath(); 
            ctx.arc(advX, advY, raioPlayer, 0, Math.PI * 2); 
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(loop);
        }

        function finalizarPartida(venceu) {
            jogoAtivo = false;
            overlay.style.display = 'flex';
            document.getElementById('btn-voltar').style.display = 'block';

            if (venceu) {
                msg.innerText = "VOCÊ VENCEU! 🏆";
                sub.innerText = "+150 Pontos adicionados ao ranking global.";
                if (window.parent && window.parent.enviarPontuacaoExterna) {
                    window.parent.enviarPontuacaoExterna(150);
                }
            } else {
                msg.innerText = "VOCÊ PERDEU... 💀";
                sub.innerText = "-10 Pontos penalizados no ranking.";
                if (window.parent && window.parent.enviarPontuacaoExterna) {
                    window.parent.enviarPontuacaoExterna(-10);
                }
            }
        }

        function fecharArena() {
            if (window.parent && window.parent.SHUTDOWN) {
                window.parent.SHUTDOWN();
            }
        }

        loop();
    </script>
</body>
</html>

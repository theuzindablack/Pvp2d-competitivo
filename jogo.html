<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core OS - Arena PVP 2D</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; background: #080808; margin: 0 auto; }
        
        #hud { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-around; pointer-events: none; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px #000; }
        .hud-p1 { color: #00f2ff; }
        .hud-p2 { color: #ff0055; }

        #tela-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; }
        #overlay-msg { font-size: 28px; color: #ffaa00; margin-bottom: 10px; font-weight: bold; }
        #overlay-sub { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .btn-acao { background: #00ff88; color: #000; border: none; padding: 12px 30px; font-weight: bold; font-size: 14px; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-family: monospace; }
        
        /* Controles Mobile */
        .joystick-base { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; touch-action: none; }
        .joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(0,242,255,0.4); border: 2px solid #00f2ff; border-radius: 50%; pointer-events: none; }
        
        .btn-atirar { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255,0,85,0.4); border: 2px solid #ff0055; border-radius: 50%; color: white; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-p1">VOCÊ (<span id="nome-voce">Player</span>): <span id="hp-voce">100</span> HP</div>
        <div class="hud-p2"><span id="nome-adv">Adversario</span>: <span id="hp-adv">100</span> HP</div>
    </div>

    <div id="tela-overlay">
        <div id="overlay-msg">CONECTANDO À ARENA</div>
        <div id="overlay-sub">Preparando combate contra o oponente...</div>
        <button id="btn-voltar" class="btn-acao" style="display:none;" onclick="fecharArena()">SAIR DA ARENA</button>
    </div>

    <div class="joystick-base" id="js-base">
        <div class="joystick-stick" id="js-stick"></div>
    </div>

    <div class="btn-atirar" id="btn-fire">ATIRAR</div>

    <canvas id="arenaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('arenaCanvas');
        const ctx = canvas.getContext('2d');

        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        const urlParams = new URLSearchParams(window.location.search);
        const adversarioNome = urlParams.get('adversario') || "Adversario";
        const meuNome = localStorage.getItem('core_os_username') || "Player";

        document.getElementById('nome-voce').innerText = meuNome;
        document.getElementById('nome-adv').innerText = adversarioNome;

        let jogoAtivo = false;
        let meuHP = 100;
        let advHP = 100;

        let playerX = canvas.width / 2 - 100;
        let playerY = canvas.height / 2;
        let advX = canvas.width / 2 + 100;
        let advY = canvas.height / 2;

        let balas = [];

        // Controles de Joystick Touch
        let jsAtivo = false;
        let jsCentroX = 0, jsCentroY = 0;
        let moveX = 0, moveY = 0;

        const jsBase = document.getElementById('js-base');
        const jsStick = document.getElementById('js-stick');

        jsBase.addEventListener('pointerdown', (e) => {
            jsAtivo = true;
            const rect = jsBase.getBoundingClientRect();
            jsCentroX = rect.left + rect.width / 2;
            jsCentroY = rect.top + rect.height / 2;
            atualizarJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (!jsAtivo) return;
            atualizarJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            jsAtivo = false;
            moveX = 0;
            moveY = 0;
            jsStick.style.transform = `translate(0px, 0px)`;
        });

        function atualizarJoystick(clientX, clientY) {
            let dx = clientX - jsCentroX;
            let dy = clientY - jsCentroY;
            const dist = Math.hypot(dx, dy);
            const raioMax = 35;

            if (dist > raioMax) {
                dx = (dx / dist) * raioMax;
                dy = (dy / dist) * raioMax;
            }

            jsStick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / raioMax;
            moveY = dy / raioMax;
        }

        // Botão Atirar
        document.getElementById('btn-fire').addEventListener('pointerdown', () => {
            if (!jogoAtivo) return;
            balas.push({ x: playerX, y: playerY, vx: 8, vy: 0, nosso: true });
        });

        // Contagem Regressiva Inicial
        let contador = 3;
        const overlay = document.getElementById('tela-overlay');
        const msg = document.getElementById('overlay-msg');
        const sub = document.getElementById('overlay-sub');

        function iniciarContagem() {
            if (contador > 0) {
                msg.innerText = contador;
                sub.innerText = "Prepare-se para o combate!";
                contador--;
                setTimeout(iniciarContagem, 1000);
            } else {
                msg.innerText = "FIGHT!";
                sub.innerText = "Elimine o oponente!";
                setTimeout(() => {
                    overlay.style.display = 'none';
                    jogoAtivo = true;
                }, 800);
            }
        }
        setTimeout(iniciarContagem, 500);

        // Loop Principal do Jogo
        function loop() {
            ctx.fillStyle = '#080808';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (jogoAtivo) {
                // Movimentação do Jogador
                playerX += moveX * 4;
                playerY += moveY * 4;

                // Limites da tela
                playerX = Math.max(20, Math.min(canvas.width - 20, playerX));
                playerY = Math.max(20, Math.min(canvas.height - 20, playerY));

                // Simulação simples de IA inimiga reativa na arena local
                if (Math.random() < 0.02) {
                    advX += (Math.random() - 0.5) * 40;
                    advY += (Math.random() - 0.5) * 40;
                }
                if (Math.random() < 0.03) {
                    balas.push({ x: advX, y: advY, vx: -6, vy: (Math.random() - 0.5) * 2, nosso: false });
                }

                // Atualizar Balas
                for (let i = balas.length - 1; i >= 0; i--) {
                    let b = balas[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    ctx.fillStyle = b.nosso ? '#00f2ff' : '#ff0055';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Colisões
                    if (b.nosso && Math.hypot(b.x - advX, b.y - advY) < 20) {
                        advHP -= 10;
                        document.getElementById('hp-adv').innerText = Math.max(0, advHP);
                        balas.splice(i, 1);
                        if (advHP <= 0) { finalizarPartida(true); break; }
                    } else if (!b.nosso && Math.hypot(b.x - playerX, b.y - playerY) < 20) {
                        meuHP -= 10;
                        document.getElementById('hp-voce').innerText = Math.max(0, meuHP);
                        balas.splice(i, 1);
                        if (meuHP <= 0) { finalizarPartida(false); break; }
                    } else if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        balas.splice(i, 1);
                    }
                }
            }

            // Desenhar Jogadores
            ctx.fillStyle = '#00f2ff';
            ctx.beginPath(); ctx.arc(playerX, playerY, 16, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#ff0055';
            ctx.beginPath(); ctx.arc(advX, advY, 16, 0, Math.PI * 2); ctx.fill();

            requestAnimationFrame(loop);
        }

        function finalizarPartida(venceu) {
            jogoAtivo = false;
            overlay.style.display = 'flex';
            document.getElementById('btn-voltar').style.display = 'block';

            if (venceu) {
                msg.innerText = "VOCÊ VENCEU! 🏆";
                sub.innerText = "+150 Pontos adicionados ao ranking global.";
                if (window.parent && window.parent.enviarPontuacaoExterna) {
                    window.parent.enviarPontuacaoExterna(150);
                }
            } else {
                msg.innerText = "VOCÊ PERDEU... 💀";
                sub.innerText = "-10 Pontos penalizados no ranking.";
                if (window.parent && window.parent.enviarPontuacaoExterna) {
                    window.parent.enviarPontuacaoExterna(-10);
                }
            }
        }

        function fecharArena() {
            if (window.parent && window.parent.SHUTDOWN) {
                window.parent.SHUTDOWN();
            }
        }

        loop();
    </script>
</body>
</html>

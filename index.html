<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minecraft Canvas P2P - Admin, Spawns, Ranks & Fullscreen</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lobby-screen">
    <h2>MINECRAFT P2P (INFINITO & ADMIN)</h2>
    <div class="card">
      <h3>SALA DE JOGO</h3>
      <p style="font-size: 11px; color: #aaa; margin-top: 5px;">ID da Sala:</p>
      <input type="text" id="room-id-input" value="SALA-MINECRAFT-123">
      <button id="btn-create">CRIAR SALA (HOST / ADMIN)</button>
      <button id="btn-join" style="background: #2c75d3; margin-top: 10px;">ENTRAR NA SALA</button>
    </div>
  </div>

  <div id="game-container">
    <div id="hud">
      <strong>STATUS:</strong> <span id="net-status">Conectado</span><br>
      <strong>SALA:</strong> <span id="room-name">-</span><br>
      <strong>JOGADORES:</strong> <span id="player-count">1</span><br>
      <strong>SEU NÚMERO:</strong> <span id="user-number">#1</span><br>
      <strong>TIME:</strong> <span id="user-team">Nenhum</span><br>
      <strong>VIDA:</strong> <span id="user-hp" style="color:#55ff55;">100 HP</span><br>
      <strong>CARGO:</strong> <span id="user-role" style="color: #aaa;">Sem Rank</span><br>
      <strong>POS:</strong> <span id="user-pos">X: 0 | Y: 0</span>
    </div>

    <div id="top-right-controls">
      <button id="btn-fullscreen">🚀 TELA CHEIA</button>
      <button id="btn-exit-room">🚪 SAIR</button>
      <button id="btn-toggle-chat">💬 CHAT</button>
      <button id="btn-toggle-admin">👑 MENU ADMIN</button>
      
      <div id="chat-box">
        <div id="chat-messages">
          <div class="msg msg-system">[Sistema] Digite :cmds no chat para ver todos os comandos!</div>
        </div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Digite algo ou :cmds..." maxlength="40">
          <button id="btn-chat-send">➤</button>
        </div>
      </div>
    </div>

    <div id="admin-toolbar">
      <div class="admin-grid">
        <button class="admin-btn" data-type="stone">🧱<br>Pedra</button>
        <button class="admin-btn" data-type="wood">🪵<br>Madeira</button>
        <button class="admin-btn" data-type="dirt">🌱<br>Terra</button>
        <button class="admin-btn" data-type="house">🏠<br>Casa</button>
        <button class="admin-btn" data-type="team">🚩<br>Spawn Time</button>
        <button class="admin-btn" data-type="nil_spawn">⚪<br>Spawn Nil</button>
        <button class="admin-btn" data-type="homing_item">🚀<br>Arma Item</button>
        <button class="admin-btn" data-type="clear">❌<br>Remover</button>
      </div>

      <div id="team-config-box">
        <div class="config-row">
          <span>Nome:</span>
          <input type="text" id="team-name-input" value="Time Alpha" placeholder="Nome do Time">
        </div>
        <div class="config-row">
          <span>Cor:</span>
          <input type="color" id="team-color-picker" value="#ff2222">
        </div>
        <button id="btn-toggle-touch-team">Trocar ao Relar: LIG</button>
      </div>

      <button id="btn-set-global-spawn">📌 Def. Spawn Padrão Aqui</button>
      <button id="btn-toggle-collision">Colisão Blocos: LIG</button>
    </div>

    <div id="hotbar-container">
      <div class="hotbar-slot" id="slot-1" data-index="0">
        <span class="hotbar-key">1</span>
        <span class="slot-icon"></span>
      </div>
      <div class="hotbar-slot" id="slot-2" data-index="1">
        <span class="hotbar-key">2</span>
        <span class="slot-icon"></span>
      </div>
      <div class="hotbar-slot" id="slot-3" data-index="2">
        <span class="hotbar-key">3</span>
        <span class="slot-icon"></span>
      </div>
    </div>

    <div id="teams-modal">
      <h3>ESCOLHA UM SPAWN / TIME</h3>
      <div id="teams-list"></div>
      <button id="btn-close-teams" style="background: #555; margin-top: 10px;">FECHAR</button>
    </div>

    <div id="ranks-modal">
      <h3>GERENCIADOR DE RANKS</h3>
      <div id="ranks-list"></div>
      <button id="btn-close-ranks" style="background: #555; margin-top: 10px;">FECHAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
          </html>

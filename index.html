<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core OS - Master Oche (Hub PvP)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #050505; color: #00ff88; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #111; border: 2px solid #00ff88; border-radius: 8px; padding: 20px; box-shadow: 0 0 20px rgba(0,255,136,0.15); }
        h1 { font-size: 18px; text-transform: uppercase; margin-top: 0; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .log-box { background: #000; border: 1px solid #222; border-radius: 4px; padding: 10px; height: 300px; overflow-y: auto; font-size: 12px; color: #ccc; margin-top: 15px; }
        .status { font-weight: bold; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Central Oche Hub (Matchmaking)</h1>
        <div id="status-rede" class="status">Status: Iniciando Hub Central...</div>
        <p style="font-size: 11px; color: #888;">ID Fixo Ativo: <b style="color: #fff;">core-os-oche-master-hub-2026</b></p>
        
        <div style="font-size: 11px; text-transform: uppercase; color: #666; margin-top: 15px;">Log de Atividades da Fila:</div>
        <div id="logs" class="log-box"></div>
    </div>

    <script>
        const ID_FIXO_OCHE = "core-os-oche-master-hub-2026";
        let masterPeer = null;
        let filaEspera = [];

        function log(msg) {
            const box = document.getElementById('logs');
            const hora = new Date().toLocaleTimeString();
            box.innerHTML += `[${hora}] ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function iniciarOcheHub() {
            log("Conectando o Hub Central com ID fixo...");
            
            // Destroi anterior se existir
            if (masterPeer) {
                try { masterPeer.destroy(); } catch(e){}
            }

            masterPeer = new Peer(ID_FIXO_OCHE);

            masterPeer.on('open', (id) => {
                document.getElementById('status-rede').innerHTML = `Status: <span style="color: #00ff88;">ONLINE (Ouvindo conexões)</span>`;
                log(`Hub pronto! ID fixo registrado com sucesso: ${id}`);
            });

            masterPeer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (!data) return;

                    // 1. Jogador entrou na fila
                    if (data.tipo === 'entrar_fila') {
                        log(`Novo player na fila: <b>${data.nome}</b> (PeerID: ${data.peerId})`);
                        
                        // Evita duplicata do mesmo PeerID
                        filaEspera = filaEspera.filter(p => p.peerId !== data.peerId);
                        filaEspera.push({ peerId: data.peerId, nome: data.nome, conn: conn });

                        checarMatchmaking();
                    }

                    // 2. Resultado de partida finalizado
                    if (data.tipo === 'fim_partida_resultado') {
                        log(`🏆 Fim de partida reportado! Vencedor: <b>${data.vencedor}</b> | Perdedor: ${data.perdedor}`);
                    }
                });

                conn.on('close', () => {
                    // Remove da fila caso o player feche a página enquanto espera
                    filaEspera = filaEspera.filter(p => p.conn !== conn);
                });
            });

            masterPeer.on('error', (err) => {
                log(`Erro no Hub: ${err.type}`);
                if (err.type === 'unavailable-id') {
                    document.getElementById('status-rede').innerHTML = `Status: <span style="color: #ff3366;">ERRO: ID já está em uso em outra aba!</span>`;
                    log("Já existe outra aba do Oche aberta. Feche-a para usar esta.");
                } else {
                    // Tenta reiniciar automaticamente após 3 segundos se cair
                    setTimeout(iniciarOcheHub, 3000);
                }
            });
        }

        function checarMatchmaking() {
            if (filaEspera.length >= 2) {
                let p1 = filaEspera.shift();
                let p2 = filaEspera.shift();

                let salaJogoId = 'sala-pvp-' + Math.random().toString(36).substr(2, 9);
                log(`Match encontrado! ⚔️ <b>${p1.nome}</b> vs <b>${p2.nome}</b> | Sala: ${salaJogoId}`);

                // O p1 vira o HOST da partida, o p2 vira o CLIENTE
                try {
                    p1.conn.send({
                        tipo: 'iniciar_partida',
                        papel: 'host',
                        adversario: p2.nome,
                        salaJogoId: salaJogoId
                    });
                } catch(e) { log(`Erro ao enviar comando para ${p1.nome}`); }

                try {
                    p2.conn.send({
                        tipo: 'iniciar_partida',
                        papel: 'cliente',
                        adversario: p1.nome,
                        salaJogoId: salaJogoId
                    });
                } catch(e) { log(`Erro ao enviar comando para ${p2.nome}`); }
            } else {
                log(`Fila atual: ${filaEspera.length} jogador(es) aguardando...`);
            }
        }

        // Iniciar ao carregar
        iniciarOcheHub();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core OS - Cliente</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #00f2ff; --bg: #0b0f19; --card: rgba(20, 25, 38, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .card { background: var(--card); border: 2px solid var(--main); border-radius: 12px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 0 20px rgba(0,242,255,0.2); text-align: center; }
        h1 { font-size: 20px; color: var(--main); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; color: #8b9bb4; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #07090f; border: 1px solid #23314f; border-radius: 6px; color: #fff; font-size: 14px; outline: none; font-family: monospace; }
        
        .btn-acao { background: var(--main); color: #07090f; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; font-family: monospace; margin-top: 10px; }
        .btn-acao:hover { background: #00c2cc; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Entrar na Fila</h1>
        
        <div class="input-group">
            <label>Seu Nick</label>
            <input type="text" id="nomeUser" value="Player1" maxlength="15">
        </div>

        <button class="btn-acao" onclick="entrarNaFila()">Entrar na Fila</button>
        <div id="status" style="font-size:11px; color:#888; margin-top:10px;"></div>
    </div>

    <script>
        const MASTER_ID = "core-os-master-hub-2026";
        let meuPeer;

        function entrarNaFila() {
            const nome = document.getElementById('nomeUser').value.trim() || "Player";
            document.getElementById('status').innerText = "Conectando...";

            // Cria um peer para o cliente e se conecta ao Master
            meuPeer = new Peer({
                config: { 
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:global.stun.twilio.com:3478' }
                    ] 
                }
            });

            meuPeer.on('open', (id) => {
                const masterConn = meuPeer.connect(MASTER_ID);

                masterConn.on('open', () => {
                    document.getElementById('status').innerText = "Na fila! Aguardando partida...";
                    masterConn.send({
                        tipo: "entrar_fila",
                        peerId: id,
                        nome: nome
                    });

                    // Salva localmente para a arena de jogo usar quando iniciar
                    localStorage.setItem('core_os_username', nome);
                });

                masterConn.on('error', () => {
                    document.getElementById('status').innerText = "Erro ao conectar com o Master.";
                });
            });

            meuPeer.on('error', (err) => {
                document.getElementById('status').innerText = "Erro na rede: " + err.type;
            });
        }
    </script>
</body>
</html>
